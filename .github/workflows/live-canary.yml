name: Live Canary

# Runs the SMALL, STABLE `live`-marked test set (all of
# test_search_flights_new_filters_live.py, the four live cases in
# tests/mcp/test_mcp_server.py::TestMCPServer, and the previously-unmocked
# cases in test_search_flights.py / test_search_dates.py — 29 tests total)
# against the real Google Flights network. These are excluded from the
# `--all` CI job (see ci.yml) because a transient search-page variant or a
# runner IP being treated worse than a residential one is a property of the
# network that day, not of this code — so they must not gate merges, but
# they must still run somewhere and be noisy when they break.
#
# Deliberately does NOT pass --all: that would also pull in the 100-case
# fuzz-gated live test (test_search_flights_fuzz.py), which is far flakier
# under a fast back-to-back burst (measured ~11% per-case failure rate) and
# would make this canary red almost every day. The fuzz-live case stays
# opt-in for humans only, via `make test-live-fuzz`; it is never scheduled.
#
# A canary's whole job is to be noisy when something is wrong, so it must
# not be able to die quietly: every pytest pass is bounded by `timeout`
# well under the job's own timeout-minutes, so a hung request becomes an
# ordinary non-zero exit instead of a job-level kill; the issue steps treat
# anything other than an explicit "success" output as failure-shaped (a
# setup step failing, a step crashing before it can report, etc. all count
# — see steps.live.outputs.result below); and they use `!cancelled()`
# rather than `always()` so a human cancelling a manual run doesn't file
# anything.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-canary
  cancel-in-progress: false

env:
  ISSUE_TITLE: "Live canary failing: Google Flights search"
  ISSUE_LABEL: "live-canary"

jobs:
  live-canary:
    name: Live search canary
    runs-on: ubuntu-latest
    # Comfortably above the worst case of the "Run live tests" step (two
    # 7-minute pytest passes + a 30s pause ≈ 14.5 min) plus setup/issue
    # overhead (~2-3 min) ≈ 17.5 min, so a hang inside a single pytest pass
    # is caught by that step's own `timeout` well before the job itself
    # would be killed.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Created up front (idempotently) so both the lookup and the create
      # step below can always rely on it existing — `gh issue create
      # --label` errors out if the label isn't already present in the repo.
      - name: Ensure canary issue label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LABEL: ${{ env.ISSUE_LABEL }}
        run: |
          set -euo pipefail
          gh label create "$LABEL" --repo "$REPO" --color ededed \
            --description "Opened/tracked by .github/workflows/live-canary.yml" 2>/dev/null || true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp

      - name: Run live tests (single retry of failures after a transient)
        id: live
        env:
          FORCE_COLOR: 1
        run: |
          set -euo pipefail
          set +e
          timeout 7m uv run pytest tests/ -m live --live -vv --junitxml=live-junit-1.xml
          first_status=$?
          set -e

          if [ "$first_status" -eq 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "First run had failures or was killed after its 7-minute limit (exit" \
               "$first_status). Roughly 1 in 60 real requests hits a transient" \
               "search-page variant, so pausing 30s and re-running only the failed" \
               "cases once before raising the alarm."
          sleep 30

          set +e
          timeout 7m uv run pytest tests/ -m live --live --last-failed -vv --junitxml=live-junit-2.xml
          retry_status=$?
          set -e

          if [ "$retry_status" -eq 0 ]; then
            echo "Retry cleared every failure — treating this run as a pass."
            echo "result=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Live tests are still failing (or timing out) after one retry of the failed cases."
          echo "result=failure" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Upload live test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Live canary results
          path: live-junit-*.xml
          if-no-files-found: warn

      # Identifies the canary's own issue by exact title AND a dedicated
      # label (never just title) so this can never touch a user's issue. If
      # the lookup itself fails (transient GitHub API error), retry a
      # couple of times; if it still fails, fail this step loudly rather
      # than silently treating "lookup failed" as "no issue exists" — that
      # confusion is exactly what caused duplicate issues before this fix.
      # `!cancelled()` (not `always()`): a human cancelling a manual run
      # should not cause this — or the two issue-filing steps below — to
      # run at all.
      - name: Find existing canary issue
        if: "!cancelled()"
        id: find_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TITLE: ${{ env.ISSUE_TITLE }}
          LABEL: ${{ env.ISSUE_LABEL }}
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          until listing=$(gh issue list --repo "$REPO" --label "$LABEL" --state open --json number,title); do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::gh issue list failed after $max_attempts attempts;" \
                   "not touching issues this run to avoid creating a duplicate."
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep $((attempt * 5))
          done
          number=$(printf '%s' "$listing" | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)][0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Fires on anything other than an explicit "success" — not just an
      # explicit "failure" — so a step that never got to write its result
      # (job/step timeout, a crashed runner, uv sync failing before the
      # tests could even start) is treated as failure-shaped too, instead
      # of silently filing nothing. Only reachable when the lookup above
      # actually succeeded (never when it failed/was skipped), so a flaky
      # `gh issue list` cannot cause a duplicate issue to be created.
      - name: Open or update issue on failure
        if: "!cancelled() && steps.live.outputs.result != 'success' && steps.find_issue.outcome == 'success'"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TITLE: ${{ env.ISSUE_TITLE }}
          LABEL: ${{ env.ISSUE_LABEL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.number }}
          LIVE_RESULT: ${{ steps.live.outputs.result }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          set -euo pipefail
          if [ "$LIVE_RESULT" = "failure" ]; then
            reason="the live tests failed twice in a row (initial run + one same-run retry of the failed cases)"
          elif [ "$LIVE_OUTCOME" = "skipped" ]; then
            reason="a setup step (installing uv, Python, or dependencies) failed before the live tests could start"
          else
            reason="the live-test step did not finish cleanly (it may have hit a time limit, crashed, or the runner was lost) before it could report a result"
          fi
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
              --body "Live canary is still failing: ${reason}. Run: $RUN_URL"
          else
            gh issue create --repo "$REPO" \
              --title "$TITLE" \
              --label "$LABEL" \
              --body "The scheduled live-canary workflow failed: ${reason}. Run: $RUN_URL"
          fi

      - name: Close issue on recovery
        if: >-
          !cancelled() && steps.live.outputs.result == 'success' &&
          steps.find_issue.outcome == 'success' && steps.find_issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "Live canary passed again. Run: $RUN_URL"
          gh issue close "$ISSUE_NUMBER" --repo "$REPO"
